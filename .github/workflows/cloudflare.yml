name: Deploy to Cloudflare Workers

# 활성화 조건: 저장소 Secrets 에 CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID 가 있고 wrangler.toml 이 커밋되어 있을 때.
on:
  push:
    branches: [main]
    paths-ignore: [".github/workflows/pages.yml"]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.CLOUDFLARE_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build static site (root path, custom domain)
        run: python scripts/build.py
      - name: Deploy worker + assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
