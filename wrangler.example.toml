# Copy to wrangler.toml AFTER creating your own resources. Nothing is provisioned here.
name = "electricpartners"
main = "worker/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "electricpartners-private-inquiries"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"
migrations_dir = "migrations"

[vars]
SITE_ORIGIN = ""
ENABLE_INQUIRIES = "false"
PRIVACY_VERIFIED = "false"
PRIVACY_VERSION = "draft-2026-09-17-v2"
TURNSTILE_HOSTNAME = ""
RETENTION_DAYS = "0"
REQUIRE_TRANSFER_CONSENT = "false"

# Store these with Wrangler secret put, never in config or frontend:
# TURNSTILE_SECRET_KEY / RATE_LIMIT_SALT / optional LEAD_NOTIFY_URL / LEAD_NOTIFY_TOKEN

[triggers]
crons = ["17 18 * * *"]
