name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve base path (custom domain vs. github.io sub-path)
        id: base
        run: |
          LIVE=$(python -c "import json;print(str(json.load(open('config/site.json'))['seo'].get('customDomainLive',False)).lower())")
          if [ "$LIVE" = "true" ]; then echo "path=" >> "$GITHUB_OUTPUT"; else echo "path=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"; fi
      - name: Build static site
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
        run: python scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
