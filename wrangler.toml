# wrangler.toml 로 복사한 뒤 값 채우기. 시크릿은 `wrangler secret put` 으로만 넣는다.
name = "electricpartners"
main = "worker/index.js"
compatibility_date = "2026-09-01"
workers_dev = true   # 도메인 연결 전까지 *.workers.dev 주소로 확인
preview_urls = false

# 커스텀 도메인 (Cloudflare 에 elecmanagepartners.com 이 추가되어 있어야 함)
# 도메인이 Cloudflare 에 추가(Active)된 뒤 아래 주석을 풀고 workers_dev 를 false 로:
# routes = [
#   { pattern = "elecmanagepartners.com", custom_domain = true },
#   { pattern = "www.elecmanagepartners.com", custom_domain = true }
# ]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[vars]
SITE_ORIGIN = "https://elecmanagepartners.com"
ENABLE_INQUIRIES = "true"
PRIVACY_VERIFIED = "true"
PRIVACY_VERSION = "2026-09-18-v1"
TURNSTILE_HOSTNAME = ""   # Turnstile 미사용
RETENTION_DAYS = "365"
REQUIRE_TRANSFER_CONSENT = "true"

# 시크릿 (wrangler secret put <NAME>):
#   SUPABASE_URL           https://xxxx.supabase.co
#   SUPABASE_SERVICE_KEY   Supabase → Project Settings → API → service_role
#   RATE_LIMIT_SALT        임의의 긴 문자열 (openssl rand -hex 32)
#   KAKAO_REST_KEY         Kakao Developers 앱 REST API 키
#   KAKAO_REFRESH_TOKEN    docs/DEPLOYMENT.md 의 발급 절차 참고
#   KAKAO_CLIENT_SECRET    (Kakao 앱에서 Client Secret 을 켠 경우)

[triggers]
crons = ["17 18 * * *"]   # 매일 03:17 KST 만료 문의 삭제
